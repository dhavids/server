services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - guacd-drive:/drive
      - guacd-record:/record

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bound to the Tailscale IP specifically, not 127.0.0.1 (cloudflared
    # reaching this runs on a different box, the VPS, over the tailnet) and
    # not 0.0.0.0 (Docker's published ports bypass ufw via iptables, so an
    # unscoped bind would be reachable from the Pi's public interface too).
    ports:
      - "${TAILSCALE_IP}:8080:8080"

volumes:
  postgres-data:
  guacd-drive:
  guacd-record:
