#!/bin/bash
# Requirement: the cloudflared CLI on the host — for one-time control-plane
# commands (tunnel login/create/list), separate from the containerized
# tunnel process itself. See scratch.md's cloudflared section for why both
# exist. Assumes print.sh is already in scope (sourced by caller).

ensure() {
    if command -v cloudflared &> /dev/null; then
        print_info "cloudflared: already installed"
        return
    fi
    print_info "cloudflared: not found, installing"
    command -v curl &> /dev/null || { apt-get update; apt-get install -y curl; }

    local arch deb_url deb_path
    arch="$(dpkg --print-architecture)"
    deb_url="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${arch}.deb"
    deb_path="$(mktemp --suffix=.deb)"
    curl -fsSL -o "$deb_path" "$deb_url"
    dpkg -i "$deb_path"
    rm -f "$deb_path"
}
