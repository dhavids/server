#!/bin/bash
# Requirement: Docker + the Compose plugin, via Docker's official apt
# repository for Ubuntu. Assumes print.sh is already in scope (sourced by
# the caller, e.g. install-req.sh).

ensure() {
    if command -v docker &> /dev/null && docker compose version &> /dev/null; then
        print_info "docker: already installed"
        return
    fi

    print_info "docker: installing"
    apt-get update
    apt-get install -y ca-certificates curl gnupg

    local keyring="/etc/apt/keyrings/docker.asc"
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$keyring"
    chmod a+r "$keyring"

    local arch codename
    arch="$(dpkg --print-architecture)"
    codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
    echo "deb [arch=$arch signed-by=$keyring] https://download.docker.com/linux/ubuntu $codename stable" \
        > /etc/apt/sources.list.d/docker.list
    apt-get update

    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    systemctl enable --now docker

    local admin_user="${SUDO_USER:-}"
    if [ -n "$admin_user" ]; then
        usermod -aG docker "$admin_user"
        print_warn "$admin_user needs to log out/in (or run 'newgrp docker') for docker group membership to take effect"
    fi
}
