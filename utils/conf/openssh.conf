#!/bin/bash
# Requirement: the OpenSSH server — opt-in in Ubuntu Server's installer,
# so a fresh VM commonly doesn't have it. Assumes print.sh is in scope.

ensure() {
    if command -v sshd &> /dev/null; then
        print_info "openssh-server: already installed"
    else
        print_info "openssh-server: installing"
        apt-get update
        apt-get install -y openssh-server
    fi
    systemctl enable --now ssh
}
