#!/bin/bash
# Requirement: the Tailscale client, via Tailscale's own official install
# script (auto-detects Debian vs Ubuntu vs others). Installing it is
# separate from joining a tailnet ("tailscale up") — that's a one-time
# identity step, not a package-install check, and belongs to whichever
# script actually joins the tailnet (e.g. vps/setup.sh).
# Assumes print.sh is already in scope (sourced by the caller).

ensure() {
    if command -v tailscale &> /dev/null; then
        print_info "tailscale: already installed"
        return
    fi
    print_info "tailscale: not found, installing"
    curl -fsSL https://tailscale.com/install.sh | sh
}
